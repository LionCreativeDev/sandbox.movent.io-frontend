<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="designBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#designBg)"/>
  <circle cx="60" cy="280" r="90" fill="#efe7d3" opacity="0.6"/>
  <circle cx="580" cy="70" r="80" fill="#efe7d3" opacity="0.5"/>

  <!-- canvas board -->
  <rect x="150" y="46" width="340" height="230" rx="12" fill="#ffffff" stroke="#f5d0e4" stroke-width="2"/>
  <rect x="150" y="46" width="340" height="26" rx="12" fill="#fdf2f8"/>
  <circle cx="168" cy="59" r="4" fill="#f472b6"/>
  <circle cx="182" cy="59" r="4" fill="#f9a8d4"/>
  <circle cx="196" cy="59" r="4" fill="#fbcfe8"/>

  <!-- wireframe blocks with dashed guides -->
  <rect x="172" y="90" width="120" height="80" rx="4" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="304" y="90" width="160" height="36" rx="4" fill="#fce7f3"/>
  <rect x="304" y="134" width="160" height="36" rx="4" fill="#fce7f3"/>
  <rect x="172" y="182" width="292" height="70" rx="4" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="188" y="198" width="100" height="8" rx="4" fill="#f9a8d4"/>
  <rect x="188" y="214" width="150" height="6" rx="3" fill="#fbcfe8"/>
  <rect x="188" y="228" width="70" height="12" rx="6" fill="#db2777"/>

  <!-- color palette swatches -->
  <g>
    <circle cx="510" cy="200" r="16" fill="#db2777"/>
    <circle cx="540" cy="185" r="16" fill="#f472b6"/>
    <circle cx="540" cy="220" r="16" fill="#f9a8d4"/>
    <circle cx="510" cy="235" r="16" fill="#fbcfe8"/>
  </g>

  <!-- pen / cursor -->
  <g transform="translate(430,235) rotate(20)">
    <path d="M0 0 L26 0 L20 40 L6 40 Z" fill="#831843"/>
    <path d="M6 40 L13 56 L20 40 Z" fill="#db2777"/>
