<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="secBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="shieldGrad" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#secBg)"/>

  <!-- hex grid background -->
  <g stroke="#e5ded0" stroke-width="1.5" fill="none" opacity="0.8">
    <polygon points="80,60 110,78 110,112 80,130 50,112 50,78"/>
    <polygon points="150,40 180,58 180,92 150,110 120,92 120,58"/>
    <polygon points="520,240 550,258 550,292 520,310 490,292 490,258"/>
    <polygon points="560,90 590,108 590,142 560,160 530,142 530,108"/>
  </g>

  <!-- network nodes/lines -->
  <g stroke="#d8cfba" stroke-width="2">
    <line x1="150" y1="150" x2="240" y2="180"/>
    <line x1="490" y1="150" x2="400" y2="180"/>
    <line x1="150" y1="260" x2="240" y2="220"/>
    <line x1="490" y1="260" x2="400" y2="220"/>
  </g>
  <circle cx="150" cy="150" r="8" fill="#d8cfba"/>
  <circle cx="490" cy="150" r="8" fill="#d8cfba"/>
  <circle cx="150" cy="260" r="8" fill="#d8cfba"/>
  <circle cx="490" cy="260" r="8" fill="#d8cfba"/>

  <!-- shield -->
  <path d="M320 40 L410 74 V178 C410 240 370 288 320 312 C270 288 230 240 230 178 V74 Z" fill="url(#shieldGrad)"/>
  <path d="M320 60 L392 88 V178 C392 230 358 270 320 292 C282 270 248 230 248 178 V88 Z" fill="#ffffff" opacity="0.15"/>

  <!-- checkmark -->
  <path d="M282 176 L310 204 L364 140" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- padlock accent -->
  <g transform="translate(320,300)">
    <rect x="-16" y="0" width="32" height="24" rx="4" fill="#7f1d1d"/>
    <path d="M-10 0 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke="#7f1d1d" stroke-width="5"/>
  </g>
</svg>
