<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="intBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#intBg)"/>
  <circle cx="60" cy="80" r="80" fill="#efe7d3" opacity="0.6"/>
  <circle cx="580" cy="290" r="90" fill="#efe7d3" opacity="0.5"/>

  <!-- connecting lines from hub to nodes -->
  <g stroke="#c7d2fe" stroke-width="3">
    <line x1="320" y1="180" x2="180" y2="90"/>
    <line x1="320" y1="180" x2="180" y2="270"/>
    <line x1="320" y1="180" x2="460" y2="90"/>
    <line x1="320" y1="180" x2="460" y2="270"/>
    <line x1="320" y1="180" x2="320" y2="60"/>
  </g>

  <!-- puzzle-piece app nodes -->
  <g fill="#818cf8">
    <rect x="150" y="60" width="60" height="60" rx="10"/>
    <rect x="150" y="240" width="60" height="60" rx="10"/>
    <rect x="430" y="60" width="60" height="60" rx="10"/>
    <rect x="430" y="240" width="60" height="60" rx="10"/>
  </g>
  <g fill="#ffffff">
    <rect x="170" y="80" width="20" height="20" rx="3"/>
    <rect x="170" y="260" width="20" height="20" rx="3"/>
    <rect x="450" y="80" width="20" height="20" rx="3"/>
    <rect x="450" y="260" width="20" height="20" rx="3"/>
  </g>

  <!-- central hub -->
  <circle cx="320" cy="180" r="56" fill="#4f46e5"/>
  <circle cx="320" cy="180" r="56" fill="none" stroke="#c7d2fe" stroke-width="3" opacity="0.7"/>

  <!-- plug icon inside hub -->
  <g transform="translate(320,180)" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="0" y1="-26" x2="0" y2="-8"/>
    <rect x="-16" y="-8" width="32" height="22" rx="8"/>
    <line x1="-8" y1="14" x2="-8" y2="26"/>
    <line x1="8" y1="14" x2="8" y2="26"/>
  </g>
</svg>
