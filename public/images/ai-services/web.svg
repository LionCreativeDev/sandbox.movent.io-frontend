  <rect x="270" y="166" width="88" height="66" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="366" y="166" width="100" height="66" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="184" y="176" width="68" height="26" rx="3" fill="#dbeafe"/>
