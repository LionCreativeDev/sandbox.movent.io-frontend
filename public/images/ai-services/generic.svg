<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="genBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="genScreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33486b"/>
      <stop offset="1" stop-color="#1b2e4b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#genBg)"/>
  <circle cx="70" cy="80" r="80" fill="#efe7d3" opacity="0.6"/>
  <circle cx="570" cy="290" r="90" fill="#efe7d3" opacity="0.5"/>

  <!-- laptop -->
  <path d="M150 268 L470 268 L500 300 Q504 310 492 310 L128 310 Q116 310 120 300 Z" fill="#334155"/>
  <rect x="150" y="46" width="320" height="222" rx="12" fill="#1e293b"/>
  <rect x="162" y="58" width="296" height="190" rx="3" fill="#ffffff"/>

  <!-- code brackets -->
  <text x="310" y="175" font-family="monospace" font-size="72" font-weight="700" fill="url(#genScreen)" text-anchor="middle">&lt;/&gt;</text>

  <!-- gear -->
  <g transform="translate(470,110)" fill="#94a3b8">
    <circle r="34"/>
    <g fill="#f8fafc">
      <rect x="-6" y="-46" width="12" height="18" rx="3"/>
      <rect x="-6" y="28" width="12" height="18" rx="3"/>
      <rect x="-46" y="-6" width="18" height="12" rx="3"/>
      <rect x="28" y="-6" width="18" height="12" rx="3"/>
    </g>
    <circle r="16" fill="#f8fafc"/>
  </g>

  <!-- cloud -->
  <g fill="#cbd5e1">
    <ellipse cx="510" cy="250" rx="46" ry="24"/>
    <ellipse cx="486" cy="240" rx="26" ry="20"/>
    <ellipse cx="534" cy="240" rx="26" ry="20"/>
  </g>

  <!-- circuit lines -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <path d="M420 60 h30 v20"/>
    <path d="M420 90 h16"/>
    <circle cx="420" cy="60" r="3" fill="#94a3b8"/>
    <circle cx="420" cy="90" r="3" fill="#94a3b8"/>
  </g>
</svg>
